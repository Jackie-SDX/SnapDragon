name: enterprise-agent-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nayla/package-lock.json
      - name: Validate controller structure
        run: bash .github/scripts/test-controller.sh
      - name: Validate workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }'
          ruby -e 'require "yaml"; YAML.load_file(".github/dependabot.yml"); puts "YAML OK: .github/dependabot.yml"'
      - name: Validate shell syntax
        shell: bash
        run: |
          find .github/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          git diff --check
      - name: Install Nayla dependencies
        working-directory: Nayla
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Nayla
        working-directory: Nayla
        run: npm test
      - name: Lint Nayla
        working-directory: Nayla
        run: npm run lint
      - name: Syntax-check Nayla runtime
        working-directory: Nayla
        run: npm run test:syntax
      - name: Controller contract tests
        shell: bash
        run: |
          bash .github/scripts/test-oc-intent.sh
          bash .github/scripts/test-oc-session-state.sh
          bash .github/scripts/test-oc-command-control.sh
          bash .github/scripts/test-oc-context.sh
          bash .github/scripts/test-oc-target.sh
          bash .github/scripts/test-oc-communication.sh
          bash .github/scripts/test-opencode-live-output.sh
