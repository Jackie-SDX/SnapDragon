name: Ballon d’Or 2026 Winner Watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: ballon-dor-2026-winner-watch
  cancel-in-progress: false
jobs:
  verify-winner:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify winner using independent reporting
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = 184;
            const marker = '<!-- ballon-dor-winner-alert-sent -->';

            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            if (existingComments.some(c => (c.body || '').includes(marker))) {
              console.log('Winner alert already sent; preventing duplicates.');
              try {
                await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: 'ballondor-watch.yml' });
              } catch (error) {
                console.log('Auto-disable unavailable: ' + error.message);
              }
              return;
            }

            function decodeHtml(s) {
              return s
                .replace(/&nbsp;|&#160;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&quot;/gi, '"')
                .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCharCode(parseInt(n, 16)))
                .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n, 10)))
                .replace(/&apos;/gi, "'")
                .replace(/&#39;/gi, "'");
            }
            function xmlValue(block, tag) {
              const re = new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'i');
              const found = block.match(re);
              return found ? decodeHtml(found[1].replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').replace(/<[^>]+>/g, ' ')).trim() : '';
            }
            function normalize(s) {
              return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            const officialUrl = 'https://ballondor.com/winners';
            // The official winners page can remain stale, and the organisers previously
            // published several contradictory pre-written winner profiles. Do not treat
            // those individual news posts as proof. Require two reputable independent
            // outlets to report the same winner instead.
            const query = '"2026" "Ballon d’Or" winner ceremony';
            const rssUrl = 'https://news.google.com/rss/search?q=' +
              encodeURIComponent(query) + '&hl=en-GB&gl=GB&ceid=GB:en';
            const rssResponse = await fetch(rssUrl, {
              headers: { 'User-Agent': 'BallonDorWinnerWatch/1.0' },
              signal: AbortSignal.timeout(15000)
            });
            if (!rssResponse.ok) throw new Error('News RSS returned HTTP ' + rssResponse.status);
            const rss = await rssResponse.text();
            const items = [...rss.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)].map(m => m[1]);

            const trustedDomain = /(^|\.)bbc\.(com|co\.uk)$|(^|\.)reuters\.com$|(^|\.)apnews\.com$|(^|\.)theguardian\.com$|(^|\.)espn\.com$|(^|\.)skysports\.com$|(^|\.)france24\.com$|(^|\.)lequipe\.fr$|(^|\.)cnn\.com$|(^|\.)nytimes\.com$|(^|\.)independent\.co\.uk$|(^|\.)dw\.com$|(^|\.)aljazeera\.com$/i;
            const candidates = [
              { name: 'Harry Kane', aliases: ['Harry Kane', 'Kane'] },
              { name: 'Lamine Yamal', aliases: ['Lamine Yamal', 'Yamal'] },
              { name: 'Kylian Mbappé', aliases: ['Kylian Mbappé', 'Kylian Mbappe', 'Mbappé', 'Mbappe'] },
              { name: 'Ousmane Dembélé', aliases: ['Ousmane Dembélé', 'Ousmane Dembele', 'Dembélé', 'Dembele'] },
              { name: 'Erling Haaland', aliases: ['Erling Haaland', 'Haaland'] },
              { name: 'Lionel Messi', aliases: ['Lionel Messi', 'Messi'] },
              { name: 'Rodri', aliases: ['Rodri'] },
              { name: 'Michael Olise', aliases: ['Michael Olise', 'Olise'] },
              { name: 'Khvicha Kvaratskhelia', aliases: ['Khvicha Kvaratskhelia', 'Kvaratskhelia'] },
              { name: 'Fabián Ruiz', aliases: ['Fabián Ruiz', 'Fabian Ruiz'] },
              { name: 'Vitinha', aliases: ['Vitinha'] },
              { name: 'Achraf Hakimi', aliases: ['Achraf Hakimi', 'Hakimi'] },
              { name: 'Jude Bellingham', aliases: ['Jude Bellingham', 'Bellingham'] },
              { name: 'Vinícius Júnior', aliases: ['Vinícius Júnior', 'Vinicius Junior', 'Vinícius', 'Vinicius'] },
              { name: 'Raphinha', aliases: ['Raphinha'] },
              { name: 'Declan Rice', aliases: ['Declan Rice'] },
              { name: 'Luis Díaz', aliases: ['Luis Díaz', 'Luis Diaz'] },
              { name: 'Pau Cubarsí', aliases: ['Pau Cubarsí', 'Pau Cubarsi'] },
              { name: 'Nuno Mendes', aliases: ['Nuno Mendes'] },
              { name: 'Gabriel Magalhães', aliases: ['Gabriel Magalhães', 'Gabriel Magalhaes'] }
            ];

            const reportsByWinner = new Map();
            for (const item of items) {
              const title = xmlValue(item, 'title');
              const description = xmlValue(item, 'description');
              const sourceTag = (item.match(/<source\b[^>]*>[\s\S]*?<\/source>/i) || [])[0] || '';
              const sourceName = xmlValue(sourceTag, 'source');
              const sourceUrlMatch = sourceTag.match(/\burl=["']([^"']+)["']/i);
              let host = '';
              try {
                host = new URL(sourceUrlMatch ? decodeHtml(sourceUrlMatch[1]) : '').hostname.toLowerCase();
              } catch (_) {}

              const titleNorm = normalize(title);
              const combinedNorm = normalize(title + ' ' + description);
              const dateText = xmlValue(item, 'pubDate');
              const link = xmlValue(item, 'link');
              const recentYear = /2026/.test(title + ' ' + description + ' ' + dateText + ' ' + link);
              const hasAward = /ballon\s*d['’]?or|ballondor/i.test(title + ' ' + description);
              const hasWinnerLanguage = /\b(wins|won|winner|crowned|claims|claimed|lifts|lifted|awarded|named|triumphs|takes home)\b/i.test(title);
              const disqualified = /\b(mistake|accidentally|prematurely|premature|leak|leaked|rumou?r|prediction|predicts|could win|to win|prepared in advance|published by mistake|not yet announced)\b/i.test(title);
              if (!trustedDomain.test(host) || !recentYear || !hasAward || !hasWinnerLanguage || disqualified) continue;

              const found = candidates.filter(c =>
                c.aliases.some(alias => {
                  const a = normalize(alias);
                  // Avoid matching very short generic aliases except when in the headline.
                  return titleNorm.includes(a) || (a.length >= 7 && combinedNorm.includes(a));
                })
              );
              const unique = [...new Map(found.map(c => [c.name, c])).values()];
              if (unique.length !== 1) continue;

              const winner = unique[0].name;
              if (!reportsByWinner.has(winner)) reportsByWinner.set(winner, new Map());
              const map = reportsByWinner.get(winner);
              if (!map.has(host)) map.set(host, { title, link, sourceName, host });
            }

            const confirmed = [...reportsByWinner.entries()]
              .filter(([, sources]) => sources.size >= 2)
              .sort((a, b) => b[1].size - a[1].size)[0];

            if (!confirmed) {
              console.log('No winner is yet confirmed by two distinct reputable outlets. Reports found: ' +
                JSON.stringify([...reportsByWinner.entries()].map(([name, outlets]) => ({ name, outlets: [...outlets.keys()] }))));
              return;
            }

            const [winner, sources] = confirmed;
            const reportList = [...sources.values()].slice(0, 3);
            const body = '@Jackie-SDX 🔔 **Confirmed: ' + winner +
              ' won the 2026 men’s Ballon d’Or.**\n\n' +
              'Official results page: ' + officialUrl + '\n\n' +
              reportList.map(r => '- ' + (r.sourceName || r.host) + ': ' + r.link).join('\n') +
              '\n\nTwo or more reputable independent outlets report the same result.\n\n' + marker;

            await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            console.log('Verified winner alert posted: ' + winner + ' using ' + [...sources.keys()].join(', '));

            try {
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed' });
            } catch (error) {
              console.log('Could not close alert issue: ' + error.message);
            }
            try {
              await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: 'ballondor-watch.yml' });
              console.log('Watcher disabled after the verified alert.');
            } catch (error) {
              console.log('Could not auto-disable watcher: ' + error.message);
            }