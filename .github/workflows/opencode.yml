name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:

    concurrency:
      group: oc-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    if: |
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/oc ') ||
        startsWith(github.event.comment.body, '/oc.') ||
        startsWith(github.event.comment.body, '/oc,') ||
        startsWith(github.event.comment.body, '/oc!') ||
        startsWith(github.event.comment.body, '/oc?') ||
        startsWith(github.event.comment.body, '/oc:') ||
        startsWith(github.event.comment.body, '/oc;') ||
        startsWith(github.event.comment.body, '/oc(') ||
        startsWith(github.event.comment.body, '/oc[') ||
        startsWith(github.event.comment.body, '/oc{') ||
        github.event.comment.body == '/opencode' ||
        startsWith(github.event.comment.body, '/opencode ') ||
        startsWith(github.event.comment.body, '/opencode.') ||
        startsWith(github.event.comment.body, '/opencode,') ||
        startsWith(github.event.comment.body, '/opencode!') ||
        startsWith(github.event.comment.body, '/opencode?') ||
        startsWith(github.event.comment.body, '/opencode:') ||
        startsWith(github.event.comment.body, '/opencode;') ||
        startsWith(github.event.comment.body, '/opencode(') ||
        startsWith(github.event.comment.body, '/opencode[') ||
        startsWith(github.event.comment.body, '/opencode{')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    env:
      UNIVERSAL_TOKEN: ${{ secrets.UNIVERSAL_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      OPENCODE_AGENT_TIMEOUT_MINUTES: "330"
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID || github.repository_owner }}
      OC_JOB_BUDGET_SECONDS: "21600"
      OC_JOB_SAFETY_MARGIN_SECONDS: "1800"
      OC_CONTEXT_SEED_BYTES: "60000"


    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false


      - name: Capture initial state
        id: initial_state
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "OC_INITIAL_SHA=$sha" >> "$GITHUB_ENV"
          echo "OC_RUN_START_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "OC_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"


      - name: Load durable /oc session state
        id: target
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
        run: bash .github/scripts/oc-session-state.sh load


      - name: Prepare durable /oc session
        id: prepare_session
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: bash .github/scripts/prepare-oc-session.sh


      - name: Collect bounded /oc context
        id: context
        continue-on-error: true
        shell: bash
        env:
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT_BODY" > "$RUNNER_TEMP/oc-request.txt"
          OC_REQUEST_FILE="$RUNNER_TEMP/oc-request.txt"           OC_TARGET_REPO="$GITHUB_REPOSITORY"           OC_TARGET_BASE="$BASE_REF"           OC_TARGET_BRANCH="$(printenv OC_SESSION_BRANCH || true)"           bash .github/scripts/collect-oc-context.sh


      - name: Resolve and verify OpenCode release
        id: opencode_release
        shell: bash
        env:
          OPENCODE_VERSION_PIN: ${{ vars.OPENCODE_VERSION || '1.18.32' }}
        run: |
          set -euo pipefail
          json="$(mktemp)"
          trap 'rm -f "$json"' EXIT
          auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          if [[ -n "$OPENCODE_VERSION_PIN" ]]; then
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 "${auth[@]}" "https://api.github.com/repos/anomalyco/opencode/releases/tags/v$OPENCODE_VERSION_PIN" -o "$json"
          else
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 "${auth[@]}" https://api.github.com/repos/anomalyco/opencode/releases/latest -o "$json"
          fi
          tag="$(jq -r '.tag_name' "$json")"
          version="${tag#v}"
          url="$(jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .browser_download_url' "$json")"
          digest="$(jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .digest' "$json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ -n "$url" && "$url" != "null" ]] || exit 1
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"


      - name: Restore verified OpenCode cache
        id: cache_restore
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.opencode_release.outputs.version }}


      - name: Install OpenCode on cache miss
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 5 --max-time 120 "${{ steps.opencode_release.outputs.url }}" -o "$tmp/opencode.tar.gz"
          digest="${{ steps.opencode_release.outputs.digest }}"
          digest="${digest#sha256:}"
          echo "$digest  $tmp/opencode.tar.gz" | sha256sum --check -
          mkdir -p "$tmp/extract"
          tar -xzf "$tmp/opencode.tar.gz" -C "$tmp/extract"
          binary="$(find "$tmp/extract" -type f -name opencode -perm -u+x | head -n 1)"
          [[ -n "$binary" ]] || exit 1
          install -Dm755 "$binary" "$HOME/.opencode/bin/opencode"
          "$HOME/.opencode/bin/opencode" --version


      - name: Add OpenCode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"


      - name: Restore native OpenCode session
        if: env.OC_NATIVE_SESSION_ID != '' && env.OC_NATIVE_SESSION_RUN_ID != '' && env.OC_NATIVE_SESSION_ARTIFACT != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restore_dir="$RUNNER_TEMP/opencode-native-session-restore"
          rm -rf "$restore_dir"
          mkdir -p "$restore_dir"
          if ! gh run download "$OC_NATIVE_SESSION_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$OC_NATIVE_SESSION_ARTIFACT" -D "$restore_dir"; then
            echo "::warning title=Native OpenCode session artifact unavailable::Falling back to durable logical session recovery."
            exit 1
          fi
          export_file="$(find "$restore_dir" -maxdepth 2 -type f -name '*.json' -print -quit)"
          [[ -n "$export_file" ]] || {
            echo "::warning title=Native OpenCode session artifact invalid::No JSON session export was found."
            exit 1
          }
          echo "OC_NATIVE_SESSION_EXPORT_FILE=$export_file" >> "$GITHUB_ENV"
          echo "Recovered native OpenCode session artifact for $OC_NATIVE_SESSION_ID"


      - name: Bootstrap Composio MCP bridge
        continue-on-error: true
        id: composio_session
        shell: bash
        run: bash .github/scripts/prepare-composio-mcp.sh


      - name: Run OpenCode attempt
        id: attempt_1
        continue-on-error: true
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        uses: ./.github/actions/oc-attempt
        with:
          attempt: '1'
          model: ${{ vars.OPENCODE_MODEL || 'opencode/mimo-v2.6-flash-free' }}
          target_number: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          base_ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          initial_sha: ${{ steps.initial_state.outputs.sha }}


      - name: Persist native OpenCode session artifact
        if: always() && steps.attempt_1.outputs.native_session_export_file != '' && steps.attempt_1.outputs.native_session_artifact != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.attempt_1.outputs.native_session_artifact }}
          path: ${{ steps.attempt_1.outputs.native_session_export_file }}
          if-no-files-found: error
          retention-days: 90


      - name: Post controlled timeout continuation
        if: always() && (steps.attempt_1.outputs.termination_reason == 'timeout' || steps.attempt_1.outputs.timed_out == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 0 }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          OPENCODE_AGENT_TIMEOUT_MINUTES: "330"
        shell: bash
        run: bash .github/scripts/post-oc-continuation.sh


      - name: Post final /oc result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          CL1: ${{ steps.attempt_1.outputs.clarification_required }}
        run: bash .github/scripts/post-oc-result.sh


      - name: Final status
        if: always()
        env:
          A1: ${{ steps.attempt_1.outputs.agent_outcome }}
          DW1: ${{ steps.attempt_1.outputs.durable_work }}
          CL1: ${{ steps.attempt_1.outputs.clarification_required }}
          RESULT_PUBLISHED: ${{ env.OC_RESULT_PUBLISHED || 'false' }}
          MEMORY_PERSISTED: ${{ env.OC_SESSION_MEMORY_PERSISTED || 'false' }}
          FINAL_RESPONSE_CAPTURED: ${{ env.OC_FINAL_RESPONSE_CAPTURED || 'false' }}
        run: |
          set -euo pipefail
          success=false
          if [[ "$CL1" == "true" ]]; then
            [[ "$RESULT_PUBLISHED" == "true" && "$MEMORY_PERSISTED" == "true" ]] && success=true
          elif [[ "$A1" == "success" ]]; then
            [[ "$RESULT_PUBLISHED" == "true" && "$MEMORY_PERSISTED" == "true" && "$FINAL_RESPONSE_CAPTURED" == "true" ]] && success=true
          elif [[ "$DW1" == "true" ]]; then
            success=true
          fi
          if [[ "$success" == "true" ]]; then exit 0; fi
          echo "::error title=OpenCode operation not verified::No successful completion or durable checkpoint was produced."
          exit 1
      - name: Clean up Composio session MCP
        if: always()
        continue-on-error: true
        env:
          SESSION_ID: ${{ steps.composio_session.outputs.session_id }}
          HEADERS_FILE: ${{ steps.composio_session.outputs.headers_file }}
        run: bash .github/scripts/cleanup-composio-mcp.sh
