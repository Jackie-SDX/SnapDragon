name: Pandoc to PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pandoc-pdf.yml"
      - "docs/pandoc-demo/**"

permissions:
  contents: read

jobs:
  pandoc-to-pdf:
    name: Markdown to PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e
        with:
          version: 3.11

      - name: Install PDF engine (TeX Live LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            poppler-utils

      - name: Report toolchain versions
        run: |
          pandoc --version
          pdflatex --version | head -n 2

      - name: Convert Markdown to PDF
        run: |
          mkdir -p output
          pandoc docs/pandoc-demo/snapdragon-pandoc-demo.md \
            --pdf-engine=pdflatex \
            --standalone \
            --output output/snapdragon-pandoc-demo.pdf

      - name: Verify the generated PDF
        run: |
          PDF=output/snapdragon-pandoc-demo.pdf
          test -f "$PDF"
          test -s "$PDF"
          SIZE="$(stat -c %s "$PDF")"
          MAGIC="$(head -c 5 "$PDF")"
          echo "artifact path : $PDF"
          echo "size bytes    : $SIZE"
          echo "magic bytes   : $MAGIC"
          test "$SIZE" -gt 1024
          test "$MAGIC" = "%PDF-"
          command -v file >/dev/null && file "$PDF" || true
          pdfinfo "$PDF"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          echo "page count     : $PAGES"
          test "$PAGES" -ge 1
          pdfinfo "$PDF" | awk -F': *' '/^Title:/ {ok = ($2 == "SnapDragon Pandoc-to-PDF Capability Test")} END {exit !ok}'
          echo "title metadata  : verified"
          echo "--- extracted text (first 20 lines) ---"
          pdftotext "$PDF" - | sed -n '1,20p'
          ls -l output

      - name: Upload PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapdragon-pandoc-demo-pdf
          path: output/snapdragon-pandoc-demo.pdf
          if-no-files-found: error
