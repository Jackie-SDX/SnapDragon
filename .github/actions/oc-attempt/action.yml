name: OpenCode attempt
description: Run one primary OpenCode execution.
inputs:
  attempt:
    required: true
    default: "1"
  model:
    required: false
    default: opencode/mimo-v2.6-flash-free
  target_number:
    required: false
    default: "0"
  base_ref:
    required: false
    default: main
  initial_sha:
    required: true
  mode:
    required: false
    default: local
  task_mode:
    required: false
    default: code
outputs:
  agent_outcome:
    value: ${{ steps.run.outputs.agent_outcome }}
  termination_reason:
    value: ${{ steps.run.outputs.termination_reason }}
  timed_out:
    value: ${{ steps.run.outputs.timed_out }}
  safe_log_path:
    value: ${{ steps.run.outputs.safe_log_path }}
  durable_work:
    value: ${{ steps.run.outputs.durable_work }}
  clarification_required:
    value: ${{ steps.run.outputs.clarification_required }}
  native_session_id:
    value: ${{ steps.run.outputs.native_session_id }}
  native_session_export_file:
    value: ${{ steps.run.outputs.native_session_export_file }}
  native_session_artifact:
    value: ${{ steps.run.outputs.native_session_artifact }}
runs:
  using: composite
  steps:
    - name: Execute primary OpenCode lifecycle
      id: run
      shell: bash
      env:
        ATTEMPT: ${{ inputs.attempt }}
        MODEL: ${{ inputs.model }}
        OC_TARGET_MODE: ${{ inputs.mode }}
        TASK_MODE: ${{ inputs.task_mode }}
        TARGET_NUMBER: ${{ inputs.target_number }}
        BASE_REF: ${{ inputs.base_ref }}
        INITIAL_SHA: ${{ inputs.initial_sha }}
      run: bash .github/scripts/run-attempt-pipeline.sh
